<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Córdoba a mesa puesta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,800&family=Figtree:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--blue:#173f8a;--blue2:#0e2a5e;--red:#b3261e;--lemon:#f4c430;--wash:#fbfaf6;--ink:#14213d;--mute:#5d6678;--line:#dfe3ea;--teal:#12806a}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:15px/1.45 Figtree,system-ui,sans-serif;background:var(--wash);color:var(--ink)}
h1,h2,h3{font-family:'Bodoni Moda',Georgia,serif}
/* HERO */
.hero{position:relative;background:var(--blue2) center/cover;color:#fff;overflow:hidden;padding:40px 20px 0;min-height:300px}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0e2a5ecc,#0e2a5e99 60%,#0e2a5eee)}
.hero>*{position:relative}
.hero-in{max-width:1100px;margin:0 auto}
.eyebrow{letter-spacing:.18em;text-transform:uppercase;font-size:12px;color:var(--lemon);font-weight:700}
.hero h1{font-size:clamp(38px,8vw,84px);line-height:.95;margin:10px 0 14px;font-weight:800}
.hero h1 em{color:var(--lemon);font-style:italic;font-weight:500}
.hero p{max-width:46ch;margin:0 0 26px;color:#dbe4f7;font-size:16px}
.arches{display:block;width:100%;height:84px;margin-top:6px}
/* BAR */
.bar{position:sticky;top:0;z-index:1000;background:var(--wash);border-bottom:1px solid var(--line);padding:10px 20px}
.bar-in{max-width:1100px;margin:0 auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar b{font-size:13px;color:var(--mute);margin-right:6px}
button.f{font:inherit;font-weight:500;border:2px solid var(--blue);background:transparent;color:var(--blue);padding:5px 14px;border-radius:4px;cursor:pointer}
button.f:hover{background:#173f8a14}
button.f.on{background:var(--blue);color:#fff}
button.f:focus-visible,.card:focus-visible{outline:3px solid var(--lemon);outline-offset:2px}
#count{margin-left:auto;font-size:13px;color:var(--mute)}
/* MAIN */
main{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0}
#list{padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;align-content:start}
.mapwrap{position:sticky;top:56px;height:calc(100vh - 56px)}
#map{height:100%}
.card{background:#fff;border:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 20px #14213d1f}
.card.sel{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue)}
.ph{position:relative;height:96px;background:var(--blue) ;overflow:hidden}
.ph svg{position:absolute;inset:0;width:100%;height:100%}
.ph .num{position:absolute;left:10px;bottom:6px;font:800 44px/1 'Bodoni Moda',serif;color:#fff;text-shadow:0 2px 8px #0008}
.ph.s{background:var(--teal)}
.ph .tag{position:absolute;right:8px;top:8px;background:var(--lemon);color:var(--ink);font-size:11px;font-weight:700;padding:2px 8px;letter-spacing:.04em}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.body h3{margin:0;font-size:19px;line-height:1.15}
.meta{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.meta span:first-child{color:var(--red);font-weight:700}
.body p{margin:0;font-size:13.5px;flex:1}
.body a{color:var(--blue);font-weight:700;font-size:13px}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--blue);border:2px solid #fff;box-shadow:0 2px 5px #0006}
.pin i{display:block;transform:rotate(45deg);color:#fff;font:700 12px/26px Figtree,sans-serif;text-align:center;font-style:normal}
.pin.s{background:var(--teal)}.pin.top{background:var(--red)}
.leaflet-container{font-family:Figtree,sans-serif}
.note{grid-column:1/-1;font-size:12px;color:var(--mute)}
@media(max-width:820px){main{grid-template-columns:1fr}.mapwrap{position:relative;top:0;height:46vh;order:-1}#list{padding:16px}.bar{top:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="hero" id="hero">
  <div class="hero-in">
    <div class="eyebrow">Guía personal · Córdoba</div>
    <h1>Mesa puesta<br>junto a la <em>Mezquita</em></h1>
    <p>15 sitios para comer salmorejo, rabo de toro y flamenquín, y 4 para una tarde de shisha y té. Todo en el mapa.</p>
  </div>
  <svg class="arches" viewBox="0 0 1200 84" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <g id="arch">
        <path d="M6 90V62a32 32 0 1 1 64 0V90" fill="none" stroke="#fbfaf6" stroke-width="14"/>
        <path d="M6 90V62a32 32 0 1 1 64 0V90" fill="none" stroke="#b3261e" stroke-width="14" stroke-dasharray="9 9"/>
      </g>
    </defs>
    <g id="row"></g>
  </svg>
</header>
<div class="bar"><div class="bar-in">
  <b>Ver:</b>
  <button class="f on" data-k="all">Todos</button>
  <button class="f" data-k="comer">Restaurantes</button>
  <button class="f" data-k="shisha">Shisha y té</button>
  <button class="f" data-k="top">Top 3</button>
  <span id="count"></span>
</div></div>
<main>
  <div id="list"></div>
  <div class="mapwrap"><div id="map"></div></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// Las coordenadas son aproximadas.
const P=[
{n:1,name:"Taberna La Montillana",tag:"MI Nº1",top:1,cat:["comer"],price:"~25–35 €",zone:"Centro",desc:"Cocina cordobesa con un punto más elaborado. Flamenquín, salmorejo y rabo de toro. Combinación excepcional de valoración y volumen de opiniones.",ll:[37.8803,-4.7787]},
{n:2,name:"Taberna Salinas",tag:"MUY CLARA PARA TI",top:1,cat:["comer"],price:"~20–30 €",zone:"Centro",desc:"Taberna cordobesa tradicional: salmorejo, berenjenas, rabo de toro… Funciona desde 1879.",ll:[37.8830,-4.7788]},
{n:3,name:"Bodegas Mezquita Céspedes",top:1,cat:["comer"],price:"~25–35 €",zone:"A unos pasos de la Mezquita",desc:"Salmorejo, rabo de toro, berenjenas y cocina tradicional. La apuesta más segura por calidad + ubicación + opiniones.",ll:[37.8800,-4.7795]},
{n:4,name:"El Rincón de Carmen",cat:["comer"],price:"~25–35 €",zone:"Judería",desc:"Cocina andaluza y un entorno especialmente bonito. Para una comida más tranquila.",ll:[37.8805,-4.7820]},
{n:5,name:"Casa Pedro Ximénez",cat:["comer"],price:"~25–35 €",zone:"Deanes / Judería",desc:"Entre los mejores alrededor del casco histórico según Tripadvisor, con miles de opiniones.",ll:[37.8786,-4.7815]},
{n:6,name:"Casa Pepe de la Judería",cat:["comer"],price:"~30–40 €",zone:"Judería",desc:"Un clásico. Por ubicación, ambiente y cocina cordobesa más que por calidad-precio.",ll:[37.8806,-4.7822]},
{n:7,name:"Bodegas Mezquita Corregidor",cat:["comer"],price:"~25–35 €",zone:"Mezquita",desc:"Otra sede extraordinariamente bien valorada de Bodegas Mezquita; más de 16.000 reseñas.",ll:[37.8789,-4.7807]},
{n:8,name:"Bodegas Mezquita Ribera",cat:["comer"],price:"~25–35 €",zone:"Ribera",desc:"Ideal si luego queréis pasear por el Puente Romano. Más de 20.000 opiniones y 4,8/5.",ll:[37.8775,-4.7790]},
{n:9,name:"Taberna Góngora",cat:["comer"],price:"~20–30 €",zone:"Centro",desc:"Más taberna y menos restaurante turístico. Comer contundente sin disparar la cuenta.",ll:[37.8850,-4.7790]},
{n:10,name:"La Compañía – Vinos y Tapas",cat:["comer"],price:"~25–35 €",zone:"Centro",desc:"Para compartir platos con vino. 4,7/5 y más de 1.000 reseñas.",ll:[37.8830,-4.7805]},
{n:11,name:"Bodegas Mezquita Cruz del Rastro",cat:["comer"],price:"~25–35 €",zone:"Centro / Ribera",desc:"Alternativa si las otras Bodegas Mezquita están llenas: 4,8 y unas 6.000 opiniones.",ll:[37.8770,-4.7765]},
{n:12,name:"Garum 2.1 Bistró",cat:["comer"],price:"~30–40 €",zone:"San Fernando",desc:"Para salir de la cocina cordobesa estrictamente tradicional y probar algo más creativo.",ll:[37.8815,-4.7755]},
{n:13,name:"Taberna La Cuarta",cat:["comer"],price:"~25–35 €",zone:"Capitulares",desc:"Cocina de fusión y unas 4.700 opiniones. Buena para cambiar de registro.",ll:[37.8840,-4.7780]},
{n:14,name:"Taberna El Abanico Patio",cat:["comer"],price:"~20–30 €",zone:"Judería",desc:"Tapas y platos cordobeses en pleno casco histórico.",ll:[37.8815,-4.7815]},
{n:15,name:"Tetería-Comida Árabe «Halal» PETRA",cat:["comer","shisha"],price:"~15–25 €",zone:"Judería · Calleja de la Hoguera",desc:"Comida árabe, tés y ambiente acorde con la zona histórica. También entra en té/shisha: 4,5/5 con ~1.860 opiniones.",ll:[37.8788,-4.7822]},
{n:"S1",name:"Aryä Shisha Club",tag:"🥇 Shisha",cat:["shisha"],zone:"Av. Manolete",desc:"Primera opción específica de cachimbas. 4,6/5. No está en pleno casco histórico, pero merece el desplazamiento.",ll:[37.8890,-4.7770]},
{n:"S2",name:"Aryä Lounge Bar",cat:["shisha"],zone:"Isla Fuerteventura",desc:"También especializado en narguiles; abre hasta bastante tarde. 4,6/5.",ll:[37.8960,-4.7930]},
{n:"S3",name:"Aryä Gold Hookah Bar – DeTapas",cat:["shisha"],zone:"Centro",desc:"En el Centro, pero con muy pocas opiniones y solo 3,8/5: por detrás de los dos anteriores.",ll:[37.8845,-4.7795]},
{n:"S4",name:"Salón de Té",cat:["shisha"],zone:"Buen Pastor · Judería",desc:"Más de 2.300 reseñas. Para té y ambiente; no para buscar la mejor cachimba.",ll:[37.8808,-4.7810]}
];
// fila de arcos de la cabecera
(function(){const r=document.getElementById('row');let h='';for(let x=-10;x<1220;x+=76)h+='<use href="#arch" x="'+x+'" y="0"/>';r.innerHTML=h})();
const map=L.map('map').setView([37.8805,-4.7795],15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const list=document.getElementById('list');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const gm=p=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.name+' Córdoba España');
const arch='<svg viewBox="0 0 100 60" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g fill="none" stroke="#ffffff30" stroke-width="7"><path d="M10 70V40a18 18 0 1 1 36 0V70"/><path d="M54 70V40a18 18 0 1 1 36 0V70"/></g></svg>';
const markers={},cards={};
P.forEach(p=>{
  const sh=!p.cat.includes('comer');
  const icon=L.divIcon({className:'',iconSize:[30,30],iconAnchor:[15,30],popupAnchor:[0,-28],html:`<div class="pin ${sh?'s':''} ${p.top?'top':''}"><i>${p.n}</i></div>`});
  markers[p.n]=L.marker(p.ll,{icon}).bindPopup(`<b>${esc(p.name)}</b><br>${p.price?esc(p.price)+' · ':''}${esc(p.zone)}<br><a target="_blank" rel="noopener" href="${gm(p)}">Abrir en Google Maps</a>`).on('click',()=>select(p.n,false));
  const c=document.createElement('article');c.className='card';c.tabIndex=0;
  c.innerHTML=`<div class="ph ${sh?'s':''}">${arch}<span class="num">${p.n}</span>${p.tag?`<span class="tag">${esc(p.tag)}</span>`:''}</div>
  <div class="body"><h3>${esc(p.name)}</h3><div class="meta">${p.price?`<span>${esc(p.price)}</span>`:''}<span>${esc(p.zone)}</span></div><p>${esc(p.desc)}</p><a target="_blank" rel="noopener" href="${gm(p)}">Abrir en Google Maps ↗</a></div>`;
  c.addEventListener('click',e=>{if(e.target.tagName!=='A')select(p.n,true)});
  c.addEventListener('keydown',e=>{if(e.key==='Enter')select(p.n,true)});
  cards[p.n]=c;list.appendChild(c);
});
const note=document.createElement('p');note.className='note';note.textContent='Posiciones aproximadas; usa el enlace de Google Maps para la ubicación exacta.';list.appendChild(note);
function select(n,pan){
  Object.values(cards).forEach(c=>c.classList.remove('sel'));cards[n].classList.add('sel');
  if(pan){map.setView(markers[n].getLatLng(),17);markers[n].openPopup();if(innerWidth<=820)window.scrollTo({top:0,behavior:'smooth'})}
  else cards[n].scrollIntoView({behavior:'smooth',block:'nearest'});
}
function apply(k){
  const vis=[];
  P.forEach(p=>{const ok=k==='all'||(k==='top'?p.top:p.cat.includes(k));cards[p.n].style.display=ok?'':'none';
    if(ok){markers[p.n].addTo(map);vis.push(p.ll)}else markers[p.n].remove()});
  document.getElementById('count').textContent=vis.length+' sitios';
  if(vis.length)map.fitBounds(vis,{padding:[40,40],maxZoom:16});
}
document.querySelectorAll('button.f').forEach(b=>b.onclick=()=>{document.querySelectorAll('button.f').forEach(x=>x.classList.remove('on'));b.classList.add('on');apply(b.dataset.k)});
apply('all');
</script>
</body>
</html>
